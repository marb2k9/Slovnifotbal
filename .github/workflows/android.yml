name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testy a sestavení APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Jednotkové testy
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Sestavení debug a release APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Kontrola APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/SlovniFotbal.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo "Commit: $GITHUB_SHA"
            echo "Sestaveno: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for f in dist/*.apk; do
              echo
              echo "== $(basename "$f") ($(stat -c %s "$f") B)"
              "$BT/aapt2" dump badging "$f" | grep -E "^package:|minSdkVersion|targetSdkVersion|uses-permission|application-label:" || true
              "$BT/apksigner" verify --print-certs "$f" | head -3 || true
            done
          } | tee dist/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SlovniFotbal-apk
          path: dist/
          if-no-files-found: error

      - name: Zveřejnění APK do větve apk-build
        if: github.event_name != 'pull_request'
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b apk-build
          git add -A
          git commit -q -m "APK z commitu $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

  instrumented:
    name: Instrumentační testy (Android ${{ matrix.api-level }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 26, 34 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Povolení KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalace a testy na emulátoru
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.api-level >= 30 && 'google_apis' || 'default' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Zveřejnění výsledků a snímků obrazovky
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p out
          find app/build/outputs -name "*.png" -path "*additional_output*" -exec cp {} out/ \; || true
          if [ -d app/build/reports/androidTests ]; then cp -r app/build/reports/androidTests out/report; fi
          find app/build/outputs/androidTest-results -name "*.xml" -exec cp {} out/ \; 2>/dev/null || true
          echo "Commit: $GITHUB_SHA, Android API ${{ matrix.api-level }}, výsledek: ${{ job.status }}" > out/RESULT.txt
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b screenshots-api${{ matrix.api-level }}
          git add -A
          git commit -q -m "Výsledky instrumentačních testů z commitu $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screenshots-api${{ matrix.api-level }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore
